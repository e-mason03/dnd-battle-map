<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;D Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ Room gate ============ -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-brand">
      <div class="sigil">⚔</div>
      <h1>D&amp;D Table</h1>
      <p>Battle maps, hexcrawls, party sheets &amp; the chronicle of your campaign.</p>
    </div>

    <div id="resume" class="resume" hidden>
      <span>Continue <b id="resumeText"></b></span>
      <button class="btn primary" id="resumeBtn" type="button">Rejoin</button>
    </div>

    <div class="gate-tabs">
      <button class="gate-tab active" data-form="joinForm" type="button">Join a room</button>
      <button class="gate-tab" data-form="createForm" type="button">Create a room</button>
    </div>

    <form id="joinForm" class="gate-form active" autocomplete="on">
      <label class="field"><span>Room code</span><input id="joinCode" required maxlength="12" placeholder="e.g. K7QF2M" autocapitalize="characters" spellcheck="false"></label>
      <label class="field"><span>Your name</span><input id="joinName" required maxlength="32" placeholder="What should the table call you?"></label>
      <label class="field"><span>Password</span><input id="joinPassword" type="password" placeholder="Player or DM password"></label>
      <button class="btn primary big" type="submit">Enter the table</button>
    </form>

    <form id="createForm" class="gate-form" autocomplete="off">
      <label class="field"><span>Campaign name</span><input id="createRoomName" maxlength="80" placeholder="Curse of the Crimson Keep"></label>
      <label class="field"><span>Your name</span><input id="createName" required maxlength="32" placeholder="Dungeon Master"></label>
      <label class="field"><span>DM password</span><input id="createDmPassword" type="password" required minlength="4" placeholder="Unlocks DM controls"></label>
      <label class="field"><span>Player password <small>(optional)</small></span><input id="createPlayerPassword" type="password" placeholder="Leave blank to let anyone with the code join"></label>
      <button class="btn primary big" type="submit">Create room</button>
    </form>

    <p id="gateError" class="gate-error" hidden></p>
  </div>
</div>

<!-- ============ App ============ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="sigil">⚔</span><span id="campaignName">Campaign</span></div>
    <nav class="nav">
      <button class="nav-btn" data-view="battle">⚔ Battle</button>
      <button class="nav-btn" data-view="hex">⬡ Hexcrawl</button>
      <button class="nav-btn" data-view="party">🛡 Party</button>
      <button class="nav-btn" data-view="journal">📜 Journal</button>
      <button class="nav-btn" data-view="stats">📊 Stats</button>
    </nav>
    <div class="topbar-right">
      <span id="presence" class="presence"></span>
      <button id="roomCode" class="room-code" title="Copy invite link">——</button>
      <span id="roleBadge" class="role-badge"></span>
      <span id="connDot" class="conn-dot"></span>
      <button id="settingsBtn" class="icon-btn" title="Room settings">⚙</button>
    </div>
  </header>

  <main class="views">
    <section id="view-battle" class="view view-canvas"></section>
    <section id="view-hex" class="view view-canvas" hidden></section>
    <section id="view-party" class="view view-page" hidden></section>
    <section id="view-journal" class="view view-page" hidden></section>
    <section id="view-stats" class="view view-page" hidden></section>
  </main>
  <footer class="statusbar"><span id="coordDisplay">—</span></footer>
</div>

<div id="toasts" class="toasts"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
